name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy
      - run: pytest --cov --cov-fail-under=90

  retrieval-eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Retrieval quality gate (recall@4 ≥ 90%, refusal accuracy ≥ 90%)
        run: ragkit eval data/qa.json --min-recall 0.9 --min-refusal 0.9 | tee -a "$GITHUB_STEP_SUMMARY"
