[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-knowledge-agent"
version = "0.1.0"
description = "Permission-aware RAG: structure-aware chunking, hybrid BM25 + dense retrieval with RRF and MMR, cited answers, groundedness checks, refusal when evidence is weak, and retrieval evals in CI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Admire T. Ndaneta" }]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ragkit = "ragkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ragkit"]

[tool.coverage.run]
source = ["ragkit"]
branch = true
